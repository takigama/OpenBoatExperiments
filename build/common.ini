; Shared PlatformIO settings for every TOBE firmware.
;
; A project's platformio.ini pulls this in and picks a base for its chip:
;
;     [platformio]
;     extra_configs = ../../../build/common.ini          ; path from the project folder
;
;     [env:esp32-c3]
;     extends = tobe_esp32c3
;     lib_extra_dirs = ../../../lib                      ; the shared libraries (lib/Tobe*)
;     extra_scripts  = pre:../../../build/scripts/tobe_pio.py
;     build_flags    = ${tobe_esp32c3.build_flags}
;                      -D MY_FLAG=1
;
; (The two paths are written out in each project because PlatformIO resolves them from the project folder,
; and projects sit at different depths.)
;
; The `platform` line below is THE pin for the whole repository: build/Dockerfile reads it from here to unpack
; the matching toolchains into the build image. Change it here, rebuild the image (build.sh --rebuild-image),
; and build everything.

[tobe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; libraries every firmware needs (TobeOta uses ArduinoJson); projects add theirs with ${tobe.lib_deps}
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -D CORE_DEBUG_LEVEL=0

; ---- ESP32-C3 (Seatalk board, FishFinder, can_sim C3, ...)
; Serial goes through the chip's native USB (what these boards are plugged in by), not the UART0 pins.
; Two app slots (ota_0/ota_1) are needed for OTA; min_spiffs makes them as large as possible.
[tobe_esp32c3]
extends = tobe
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags =
    ${tobe.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ---- ESP32-S3 (HELM 7in display, S3-Zero): projects set their own board / flash / partitions
[tobe_esp32s3]
extends = tobe
board = esp32-s3-devkitc-1
build_flags =
    ${tobe.build_flags}

; ---- classic ESP32 (the CYD "cheap yellow display" boards)
[tobe_esp32]
extends = tobe
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
    ${tobe.build_flags}

; ---- the CYD (ESP32-2432S028R): the wiring is the same on every unit, the panel driver is project specific
; (some units want ILI9341_2 + inversion, some ST7789 - set the driver in the project).
[tobe_cyd_tft_pins]
build_flags =
    -D USER_SETUP_LOADED=1
    -D USE_HSPI_PORT=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
