; FishFinderProBluetoothCYD - standalone display unit for the same "Fish
; Helper Pro" castable BLE sonar as FishFinderProBluetooth, but targeting
; a "CYD" (Cheap Yellow Display) board instead of a bare ESP32-C3: BLE
; central connects to the sonar, decodes frames (same protocol/logic as
; FishFinderProBluetooth - see that project's README for the full frame
; format writeup), and shows depth/temp/battery live on the built-in
; 2.8" screen instead of (or alongside) Serial output.
;
; Board: ESP32-2432S028R ("CYD"), confirmed via esptool against a real
; unit - ESP32-D0WD-V3, 4MB flash, classic WROOM-32 die (WiFi + Classic BT
; + BLE, same single-radio coexistence caveat as FishFinderProBluetooth's
; C3). CH340 USB-serial, ILI9341 240x320 SPI display. XPT2046 resistive
; touch lives on a SEPARATE hardware SPI bus (SCK=25, MOSI=32, MISO=39,
; CS=33 - confirmed against ../../EngineControl's already-working config
; for this same board, not just documentation), NOT sharing the display's
; MISO/MOSI/SCLK as originally assumed here. The SD slot's pins aren't
; confirmed either way yet. Neither touch nor SD are wired up in this
; project yet (v1 is read-only display) - see README "Next steps".
;
; Built via the Dockerfile in this same directory - see that file's
; header comment for the exact build/flash invocation.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; OTA needs two app partitions (ota_0/ota_1) - same reasoning as
; FishFinderProBluetooth/ESP32Seatalk's platformio.ini: min_spiffs trades
; filesystem space (not needed here) for the biggest possible pair of OTA
; app slots.
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^1.4.1
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson@^7

build_flags =
    -D FW_BUILD=11

    ; TFT_eSPI is configured entirely via build_flags (no library-source
    ; edits needed) - keeps the Docker build reproducible without a
    ; User_Setup.h step. Pin mapping is the standard ESP32-2432S028R
    ; reference layout.
    ;
    ; This exact combination - ILI9341_2_DRIVER, USE_HSPI_PORT,
    ; SPI_FREQUENCY=55MHz, TFT_INVERSION_ON - is copied from the
    ; community's own witnessmenow/ESP32-Cheap-Yellow-Display example
    ; repo's "cyd2usb" build variant, verified by actually flashing it
    ; unmodified onto this exact physical unit first: full 320x240
    ; landscape, no corruption, correct colors. Everything this project
    ; tried before that (plain ILI9341_DRIVER, various SPI clocks,
    ; TFT_RGB_ORDER, native portrait as a workaround, even a full
    ; alternate display library via a temporary EngineControl build) was
    ; chasing a config bug that turned out to be simply missing
    ; USE_HSPI_PORT and running the SPI clock far slower than this panel
    ; actually needs - not a hardware defect after all.
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D USE_HSPI_PORT=1
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
