; FishFinderProBluetoothCYD - standalone display unit for the same "Fish Helper Pro" castable BLE sonar as
; FishFinderProBluetooth, but targeting a "CYD" (Cheap Yellow Display) board instead of a bare ESP32-C3: BLE
; central connects to the sonar, decodes frames (same protocol/logic as FishFinderProBluetooth - see that
; project's README for the full frame format writeup), and shows depth/temp/battery live on the built-in 2.8"
; screen instead of (or alongside) Serial output.
;
; Board: ESP32-2432S028R ("CYD"), confirmed via esptool against a real unit - ESP32-D0WD-V3, 4MB flash, classic
; WROOM-32 die (WiFi + Classic BT + BLE, same single-radio coexistence caveat as FishFinderProBluetooth's C3).
; CH340 USB-serial, ILI9341 240x320 SPI display. XPT2046 resistive touch lives on a SEPARATE hardware SPI bus
; (SCK=25, MOSI=32, MISO=39, CS=33 - confirmed against ../../EngineControl's already-working config for this
; same board), NOT sharing the display's MISO/MOSI/SCLK. The SD slot's pins aren't confirmed either way yet.
;
; Build with   build/build.sh FishFinderProBluetoothCYD   (from the repository root) - see build/README.md.
; Name, version and OTA location come from build/projects.json, not from here.

[platformio]
extra_configs = ../../../build/common.ini

[env:esp32dev]
extends = tobe_esp32
lib_extra_dirs = ../../../lib
extra_scripts = pre:../../../build/scripts/tobe_pio.py
lib_deps =
    ${tobe.lib_deps}
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^1.4.1
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
    ${tobe_esp32.build_flags}
    ; TFT_eSPI is configured entirely via build_flags (no library-source edits needed). The pin mapping and bus
    ; (HSPI, 55 MHz) are the shared CYD set in build/common.ini. The driver line below is copied from the
    ; community's witnessmenow/ESP32-Cheap-Yellow-Display "cyd2usb" build variant, verified by flashing it
    ; unmodified onto this exact physical unit first: full 320x240 landscape, no corruption, correct colours.
    ; (Everything tried before that was chasing a config bug - a missing USE_HSPI_PORT and a far too slow SPI
    ; clock - not a hardware defect.)
    ${tobe_cyd_tft_pins.build_flags}
    -D ILI9341_2_DRIVER=1
    -D TFT_INVERSION_ON=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
