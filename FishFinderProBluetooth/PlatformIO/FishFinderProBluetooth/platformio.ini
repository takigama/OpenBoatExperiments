; FishFinderProBluetooth - BLE central bridging a castable "Fish Helper Pro"
; sonar to Serial (the real deployment target is a wired link into an RPi
; running OpenPlotter, not WiFi/MQTT - see op_mode.h/main.cpp). Board:
; ESP32-C3 dev board, matching Esp32RaymarineSeatalk - same GitHub-hosted
; OTA setup (used for occasional WiFi-mode admin/updates), developed the
; same way (push to GitHub, pull via OTA).
;
; Built via the Dockerfile in this same directory - see that file's header
; comment for the exact build/flash invocation.

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; OTA needs two app partitions (ota_0/ota_1) - the board's default single-
; app-partition scheme can't do it at all. Same tradeoff as ESP32Seatalk:
; min_spiffs trades filesystem space (this project has no filesystem
; needs at all) for the biggest possible pair of OTA app slots.
board_build.partitions = min_spiffs.csv

lib_deps =
    bblanchon/ArduinoJson@^7
    h2zero/NimBLE-Arduino@^1.4.1

build_flags =
    -D FW_BUILD=4
    ; Route Serial through the native USB-Serial/JTAG controller (what
    ; this board is actually plugged in via) instead of the default UART0
    ; pins - same C3 gotcha as ESP32Seatalk (see its platformio.ini).
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
