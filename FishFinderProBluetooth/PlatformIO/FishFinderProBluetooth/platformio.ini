; FishFinderProBluetooth - BLE central bridging a castable "Fish Helper Pro"
; sonar to MQTT. Board: generic ESP32 dev board (no custom hardware for
; this project yet - swap board= below if/when one gets picked).
;
; Built via the Dockerfile in this same directory - see that file's header
; comment for the exact build/flash invocation.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
    knolleary/PubSubClient@^2.8

build_flags =
    -D FW_BUILD=1
