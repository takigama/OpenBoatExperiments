; FishFinderProBluetooth - BLE central bridging a castable "Fish Helper Pro" sonar to Serial (the real
; deployment target is a wired link into an RPi running OpenPlotter, not WiFi/MQTT - see op_mode.h/main.cpp).
; Board: ESP32-C3 dev board. Updates come over the air from GitHub (WiFi mode, occasional admin).
;
; Build with   build/build.sh FishFinderProBluetooth   (from the repository root) - see build/README.md.
; Name, version and OTA location come from build/projects.json, not from here.

[platformio]
extra_configs = ../../../build/common.ini

[env:esp32-c3]
extends = tobe_esp32c3
lib_extra_dirs = ../../../lib
extra_scripts = pre:../../../build/scripts/tobe_pio.py
lib_deps =
    ${tobe.lib_deps}
    h2zero/NimBLE-Arduino@^1.4.1
build_flags =
    ${tobe_esp32c3.build_flags}
