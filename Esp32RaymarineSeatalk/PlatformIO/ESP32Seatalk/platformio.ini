; ESP32Seatalk - SeaTalk1 <-> WiFi bridge (SignalK/MQTT), NMEA2000/CAN bridging, GitHub-hosted OTA.
; Board: ESP32-C3 (Mine9.0:ESP32_C3_OLED module, see ../../ESP32Seatalk/ hardware project).
;
; Build with   build/build.sh ESP32Seatalk   (from the repository root) - see build/README.md.
; Name, version and OTA location come from build/projects.json, not from here.

[platformio]
extra_configs = ../../../build/common.ini

[env:esp32-c3]
extends = tobe_esp32c3
lib_extra_dirs = ../../../lib
extra_scripts = pre:../../../build/scripts/tobe_pio.py

lib_deps =
    ${tobe.lib_deps}
    knolleary/PubSubClient@^2.8
    links2004/WebSockets@^2.4.1
    ttlappalainen/NMEA2000-library@^4.24.1

build_flags =
    ${tobe_esp32c3.build_flags}
    ; Started at 512 for the numeric decoded-value payloads, which was plenty - but the raw/{seatalk,can,signalk}
    ; hex-dump topics (see mqtt_manager.h) publish whole messages hex-encoded with a space per byte (~3x the
    ; original size), and a real SignalK delta's JSON alone can be 150-200+ bytes before that expansion.
    ; Measured a real delta landing right at the 512 limit including topic + PubSubClient's own framing overhead -
    ; publish() was failing silently (return value not checked) rather than truncating loudly. 2048 gives real
    ; headroom for that plus the largest CAN fast-packet messages (up to 223 data bytes -> ~670 hex chars).
    -D MQTT_MAX_PACKET_SIZE=2048
