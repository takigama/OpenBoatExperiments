; ESP32Seatalk - SeaTalk1 <-> WiFi bridge (SignalK/MQTT), NMEA2000/CAN bridging,
; GitHub-hosted OTA. Board: ESP32-C3 (Mine9.0:ESP32_C3_OLED module, see
; ../../ESP32Seatalk/ hardware project).
;
; Built via the Dockerfile in this same directory - see that file's header
; comment for the exact build/flash invocation. Not built with a bare host
; toolchain; the Docker image is the reproducible source of truth.

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; OTA needs two app partitions (ota_0/ota_1) - the board's default single-
; app-partition scheme can't do it at all. min_spiffs trades filesystem
; space for the biggest possible pair of OTA app slots, which is what we
; want here (small SPIFFS footprint - just holding config, not assets).
board_build.partitions = min_spiffs.csv

lib_deps =
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8
    links2004/WebSockets@^2.4.1
    ttlappalainen/NMEA2000-library@^4.24.1

build_flags =
    -D FW_BUILD=15
    ; PubSubClient's default 256-byte MQTT_MAX_PACKET_SIZE is plenty for
    ; the numeric payloads this project publishes, but topic length eats
    ; into that same buffer too - our topics get fairly long
    ; (base/navigation/speedThroughWater etc.), so bump it for headroom.
    -D MQTT_MAX_PACKET_SIZE=512
    ; Route Serial through the native USB-Serial/JTAG controller (what we're
    ; actually plugged into) instead of the default UART0 pins, which
    ; aren't wired to anything reachable here - see the schematic's notes
    ; on the C3's two USB peripherals sharing GPIO18/19.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
