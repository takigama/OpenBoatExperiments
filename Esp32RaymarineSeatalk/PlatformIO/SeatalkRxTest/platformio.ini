; SeatalkRxTest - the least firmware that can answer one question: with NOTHING else running (no WiFi, no MQTT,
; no web, no OTA), does the SeaTalk receive on this board still lose / mangle messages?
; Flash it over USB (this is a test, not a release). Build with   build/build.sh SeatalkRxTest

[platformio]
extra_configs = ../../../build/common.ini

[env:esp32-c3]
extends = tobe_esp32c3
extra_scripts = pre:../../../build/scripts/tobe_pio.py

; no libraries at all
lib_deps =

build_flags =
    ${tobe_esp32c3.build_flags}
