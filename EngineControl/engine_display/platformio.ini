; engine_display - the EngineControl display firmware (MD2030 engine panel): one sketch, built for
;   helm  the 7in HELM display (Viewe 7in ESP32-S3-N16R8, 16 MB flash, OPI PSRAM) - the main unit; owns WiFi,
;         updates itself and (over ESP-NOW / CAN) the other units
;   cyd   a CYD (ESP32-2432S028R) used as a secondary display, fed by the HELM over ESP-NOW; flashed by USB
;         (single application slot, no OTA)
;
; Build with   build/build.sh EngineControl-Helm   or   EngineControl-CYD   (from the repository root).
; Name, version and OTA entry come from build/projects.json, not from here.

[platformio]
extra_configs = ../../build/common.ini

; what both displays need: LVGL + the Espressif display-panel stack. The panel / LVGL configuration headers
; (lv_conf.h, esp_panel_*_conf.h) live in src/, which is added to the include path so the libraries find them.
[engine_display_base]
lib_extra_dirs = ../../lib
extra_scripts = pre:../../build/scripts/tobe_pio.py
lib_deps =
    ${tobe.lib_deps}
    lvgl/lvgl@8.4.0
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I src
    -I ../common

[env:helm]
extends = tobe_esp32s3, engine_display_base
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = app3M_fat9M_16MB.csv
build_flags =
    ${tobe_esp32s3.build_flags}
    ${engine_display_base.build_flags}

[env:cyd]
extends = tobe_esp32, engine_display_base
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
build_flags =
    ${tobe_esp32.build_flags}
    ${engine_display_base.build_flags}
    -D TARGET_BOARD=2
