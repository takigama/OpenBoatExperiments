; can_sim - the CAN-bus engine simulator for EngineControl (up to 4 fake MD2030 engines + an alarmer), on a bare
; ESP32-C3 or an ESP32-S3-Zero. Talks to the HELM display over CAN and/or ESP-NOW.
;
; Build with   build/build.sh EngineControl-CanSim   (from the repository root) - see build/README.md.
; Name, version and OTA entry come from build/projects.json, not from here.

[platformio]
extra_configs = ../../build/common.ini

; ---- ESP32-C3. 1.9 MB application slots (min_spiffs), ~61% used.
[env:c3]
extends = tobe_esp32c3
lib_extra_dirs = ../../lib
extra_scripts = pre:../../build/scripts/tobe_pio.py
lib_deps =
    ${tobe.lib_deps}
build_flags =
    ${tobe_esp32c3.build_flags}
    -I ../common

; ---- ESP32-S3-Zero (4 MB flash). The default partition scheme leaves 1.25 MB application slots; this image
; is ~85% of that, so keep an eye on size before adding features.
[env:s3zero]
extends = tobe_esp32s3
board_upload.flash_size = 4MB
board_build.partitions = default.csv
lib_extra_dirs = ../../lib
extra_scripts = pre:../../build/scripts/tobe_pio.py
lib_deps =
    ${tobe.lib_deps}
build_flags =
    ${tobe_esp32s3.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I ../common
