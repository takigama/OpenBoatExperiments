; Multiple standalone test builds live in src/ (one per feature investigated
; so far), each a fully self-contained setup()/loop() program - see
; FINDINGS.md section 10 for what each one is. Each gets its own PlatformIO
; environment, scoped to just that file via build_src_filter, so picking
; which one to build/upload is a `-e <name>` flag, never a file rename:
;
;   pio run -e display_mob_test -t upload
;   pio run -e wifi_persistence_test -t upload
;   pio run -e continuous_scan_diagnostic -t upload
;
; Plain `pio run` (no -e) builds default_envs below instead - this is
; deliberately the one meant to become the real GitHub release build once
; the features above are merged into a single firmware (see full_featured's
; secrets.h / no_secrets.h split: people building their own release from
; source can drop in a real secrets.h with their own tag EIKs, or build
; as-is and rely on OTA + configuring tags some other way later).

[platformio]
default_envs = full_featured

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; None of these builds need OTA or a filesystem partition - trade that
; space for a single large app partition instead (needed once BLE + WiFi +
; HTTPClient's TLS stack are combined, harmless for the smaller builds).
board_build.partitions = huge_app.csv

[env:continuous_scan_diagnostic]
build_src_filter = +<*> -<wifi_persistence_test.cpp> -<full_featured.cpp> -<display_mob_test.cpp> -<serial_bridge.cpp>

[env:serial_bridge]
build_src_filter = +<*> -<continuous_scan_diagnostic.cpp> -<wifi_persistence_test.cpp> -<full_featured.cpp> -<display_mob_test.cpp>

[env:wifi_persistence_test]
build_src_filter = +<*> -<continuous_scan_diagnostic.cpp> -<full_featured.cpp> -<display_mob_test.cpp> -<serial_bridge.cpp>

[env:full_featured]
build_src_filter = +<*> -<continuous_scan_diagnostic.cpp> -<wifi_persistence_test.cpp> -<display_mob_test.cpp> -<serial_bridge.cpp>
lib_ldf_mode = deep

[env:display_mob_test]
build_src_filter = +<*> -<continuous_scan_diagnostic.cpp> -<wifi_persistence_test.cpp> -<full_featured.cpp> -<serial_bridge.cpp>
lib_ldf_mode = deep
lib_deps =
	bodmer/TFT_eSPI@^2.5.33
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
; Display/touch pin config - copied from
; TheHub/ESP32StandAloneHub/StandAloneHub's proven setup for the same
; ESP32-2432S028R "CYD" board (confirmed against the board's own pinout doc,
; see FINDINGS.md).
build_flags =
	-DUSER_SETUP_LOADED
	-DUSE_HSPI_PORT
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DST7789_DRIVER
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_OFF
