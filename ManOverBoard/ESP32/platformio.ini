; Multiple standalone test builds live in src/ (one per feature investigated so far), each a fully self-contained
; setup()/loop() program - see FINDINGS.md section 10 for what each one is. Each gets its own PlatformIO
; environment, scoped to just that file via build_src_filter, so picking which one to build is a name, never a
; file rename:
;
;   build/build.sh ManOverBoard-FullFeatured    # the real build (full_featured)
;   build/build.sh ManOverBoard-DisplayTest     # display_mob_test
;
; (the other test programs - wifi_persistence_test, continuous_scan_diagnostic, serial_bridge - still build with
;  `pio run -e <name>` from this folder if you need them.)
;
; Plain `pio run` (no -e) builds default_envs below instead - this is deliberately the one meant to become the
; real GitHub release build once the features above are merged into a single firmware (see full_featured's
; secrets.h / no_secrets.h split: people building their own release from source can drop in a real secrets.h
; with their own tag EIKs, or build as-is and rely on OTA + configuring tags some other way later).

[platformio]
default_envs = full_featured
extra_configs = ../../build/common.ini

; None of these builds need OTA or a filesystem partition - trade that space for a single large app partition
; instead (needed once BLE + WiFi + HTTPClient's TLS stack are combined, harmless for the smaller builds).
[mob_esp32]
extends = tobe_esp32
board_build.partitions = huge_app.csv
lib_extra_dirs = ../../lib
extra_scripts = pre:../../build/scripts/tobe_pio.py

[env:continuous_scan_diagnostic]
extends = mob_esp32
build_src_filter = +<*> -<wifi_persistence_test.cpp> -<full_featured.cpp> -<display_mob_test.cpp> -<serial_bridge.cpp>

[env:serial_bridge]
extends = mob_esp32
build_src_filter = +<*> -<continuous_scan_diagnostic.cpp> -<wifi_persistence_test.cpp> -<full_featured.cpp> -<display_mob_test.cpp>

[env:wifi_persistence_test]
extends = mob_esp32
build_src_filter = +<*> -<continuous_scan_diagnostic.cpp> -<full_featured.cpp> -<display_mob_test.cpp> -<serial_bridge.cpp>

[env:full_featured]
extends = mob_esp32
build_src_filter = +<*> -<continuous_scan_diagnostic.cpp> -<wifi_persistence_test.cpp> -<display_mob_test.cpp> -<serial_bridge.cpp>
lib_ldf_mode = deep

[env:display_mob_test]
extends = mob_esp32
build_src_filter = +<*> -<continuous_scan_diagnostic.cpp> -<wifi_persistence_test.cpp> -<full_featured.cpp> -<serial_bridge.cpp>
lib_ldf_mode = deep
lib_deps =
    ${tobe.lib_deps}
    bodmer/TFT_eSPI@^2.5.33
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
; Display/touch pin config - the CYD set in build/common.ini, proven on TheHub for the same ESP32-2432S028R board
; (confirmed against the board's own pinout doc, see FINDINGS.md).
build_flags =
    ${tobe_esp32.build_flags}
    ${tobe_cyd_tft_pins.build_flags}
    -D ST7789_DRIVER
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF
