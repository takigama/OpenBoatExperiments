; Separate PlatformIO project from ../ESP32 (that one targets the classic dual-core chip the CYD/hub uses) - an
; ESP32-C3 is a genuinely different target (single-core RISC-V), not just a build flag away, so it gets its own
; project rather than another environment in the same one.
;
; Board config (USB CDC) is the same ESP32-C3 base every C3 firmware here uses (build/common.ini).
;
; Build with   build/build.sh ManOverBoard-SerialBridgeC3   (from the repository root) - see build/README.md.

[platformio]
extra_configs = ../../build/common.ini

[env:esp32-c3-devkitm-1]
extends = tobe_esp32c3
lib_extra_dirs = ../../lib
extra_scripts = pre:../../build/scripts/tobe_pio.py
