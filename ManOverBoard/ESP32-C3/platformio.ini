; Separate PlatformIO project from ../ESP32 (that one targets board=esp32dev,
; the classic dual-core chip the CYD/hub uses) - an ESP32-C3 is a genuinely
; different target (single-core RISC-V), not just a build flag away, so it
; gets its own project rather than another environment in the same one.
;
; Board config (board id, USB CDC build flags) copied from the working
; OpenSensor project's proven ESP32-C3 setup
; (../../OpenSensor/PlatformIO/OpenSenseESP32/platformio.ini) rather than
; re-derived from scratch.

[env:esp32-c3-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
