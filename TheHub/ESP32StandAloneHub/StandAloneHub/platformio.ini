; TheHub - stand-alone hub on a CYD (ESP32-2432S028R): TFT + resistive touch, no external parts.
;
; Build with   build/build.sh TheHub   (from the repository root) - see build/README.md.
; Name and version come from build/projects.json, not from here.

[platformio]
extra_configs = ../../../build/common.ini

[env:denky32]
extends = tobe_esp32
lib_extra_dirs = ../../../lib
extra_scripts = pre:../../../build/scripts/tobe_pio.py
lib_ldf_mode = deep
lib_deps =
    ${tobe.lib_deps}
    bodmer/TFT_eSPI@^2.5.33
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
    ${tobe_esp32.build_flags}
    ${tobe_cyd_tft_pins.build_flags}
    -D ST7789_DRIVER
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF
