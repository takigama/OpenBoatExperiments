; OpenSense - the OpenSensor ESP32-C3 sensor node (IMU, compass, pressure, OLED).
;
; Build with   build/build.sh OpenSensor   (from the repository root) - see build/README.md.
; Name and version come from build/projects.json, not from here.

[platformio]
extra_configs = ../../../build/common.ini

[env:esp32-c3-devkitm-1]
extends = tobe_esp32c3
lib_extra_dirs = ../../../lib
extra_scripts = pre:../../../build/scripts/tobe_pio.py
build_flags =
    ${tobe_esp32c3.build_flags}
    -D NUSE_SCANNER
lib_deps =
    ${tobe.lib_deps}
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit BMP085 Library@^1.2.4
    adafruit/Adafruit MPU6050@^2.2.6
    mprograms/QMC5883LCompass@^1.2.3
    olikraus/U8g2@^2.36.17
